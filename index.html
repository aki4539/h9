<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ｈ９ タイピング！ 19851114 ver.41</title><style>body{font-family:system-ui,sans-serif;background:#101827;color:#f1f5f9;margin:0;padding:22px}main{max-width:680px;margin:auto}.panel{background:#1e293b;border-radius:16px;padding:22px;margin:16px 0}h1{font-size:26px}button,input{font:inherit;border-radius:9px;padding:12px}button{background:#38bdf8;border:0;cursor:pointer;font-weight:bold}input{box-sizing:border-box;width:100%;background:#0f172a;color:white;border:1px solid #64748b;font-size:22px;text-align:center}.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.muted{color:#94a3b8}.bar{height:12px;background:#334155;border-radius:8px;overflow:hidden}.fill{height:100%;background:#f87171;width:100%}#timerbar{background:#38bdf8}#word{font-size:38px;font-weight:bold;text-align:center;margin:35px 0 8px}#roman{text-align:center;min-height:30px;color:#a5f3fc;overflow-wrap:anywhere}#message{text-align:center;min-height:24px}button:disabled{opacity:.5}</style></head><body><main><h1>⌨️ Ｈ９ タイピング！ 19851114 ver.41</h1><p class="muted">日本語(にほんご)をローマ字(じ)で入力(にゅうりょく)！ミスや時間切(じかんぎ)れでHPが減(へ)ります。</p><div class="panel"><div class="stats"><b id="hp">HP ♥♥♥♥♥</b><b id="score">スコア 0</b><b id="combo">コンボ 0</b><b id="acc">正確率(せいかくりつ) 100%</b></div><p class="muted">HP</p><div class="bar"><div class="fill" id="hpbar"></div></div><p class="muted">残(のこ)り時間(じかん) <span id="time">10.0</span>秒(びょう) / レベル <span id="level">1</span></p><div class="bar"><div class="fill" id="timerbar"></div></div><div id="word">準備完了(じゅんびかんりょう)？</div><div id="roman">READY</div><p><input id="answer" disabled autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ここにローマ字(じ)を入力(にゅうりょく)"></p><p id="message">スタートを押(お)してください</p><button id="start">▶ ゲームスタート</button> <button id="reset" disabled>リセット</button></div><p class="muted">正解候補(せいかいこうほ)は複数登録(ふくすうとうろく)されている場合(ばあい)があります。</p></main><script>
// 公開者用：表示する日本語と正解ローマ字を編集してください。
const QUESTIONS=[["ねこ","neko"],["冶金","tikin"],["勿忘草","monowasuresou"],["給餌","kyuuesa"],["探索","zyugyou"],["笠地蔵","sasazizou"],["麦藁","sobabou"],["棚","saku"],["兵糧丸","hyouroumaru"],["小児科","syouzika"],["十六夜","zyuurokuya"],["百足","hyakuasi"],["潤滑","toukatu"],["蠢く","todoroku"],["従来","ourai"],["茗荷","asini"],["迫撃砲","tuigekihou"],["プラーガ","ganaado"],["外科","gaika"],["ブーム","biimu"],["一汁三菜","itizirusanna"],["貝","me"],["小林多喜二","kobayasitakini"],["段差","rakusa"],["井の中の蛙","inonakanosyake"],["島崎藤村","simazakihuzimura"],["舌下治療","sitasitatiryou"],["鳴門大橋","meimonoohasi"],["蜥蜴","koumori"],["産毛","umou"],["山羊","yamahituzi"],["続き","yaki"],["燕尾服","tubameohuku"],["祝詞","makurakotoba"],["高木渉","takagisigeru"],["移植","gosyoku"],["粗製濫造","sozeiseizou"],["真言","singen"],["体細胞","karadasaibou"],["白魚","sirazakana"],["面立ち","turadati"],["棚","gake"],["勝ちました","otimasita"],["翳り","nigori"],["冴えに冴え渡って","hienihiewatatte"],["建御名方神","kengomeikatakami"],["背後","saigo"],["円環","enzyou"],["叙述","zyozyou"],["来そう","kosou"],["不寝の番","husinnoban"],["お祖父さん","osohusan"],["獲得","etoku"],["旨","uma"],["海岸","umibe"],["生け垣","haegiwa"],["生け簀","ikee"],["稚内","tinai"],["鬼灯","onibi"],["ちりとり","moritori"],["味覇","miso"],["罹患","rakan"],["震撼","sintou"],["仙人掌","senninsyou"],["プレステージ","koonpotaazyu"],["暖簾","danro"],["飛蚊症","himonsyou"],["推測","okusoku"],["精悍","seikou"],["兎","kitune"],["肥立ち","koedati"],["婚姻","konkon"],["地図","tibu"],["焼売","syuubai"],["博打","hakata"],["風除室","kazeyokesitu"],["九十九神","kyuuzyuukyuusin"],["蛹","oke"],["臓物","zoubutu"]];
const $=id=>document.getElementById(id);let hp=5,score=0,combo=0,correct=0,miss=0,level=1,remaining=10,duration=10,running=false,current=null,answers=[],previous=-1,interval=null,last=0;
function update(){ $('hp').textContent='HP '+ '♥'.repeat(hp)+'♡'.repeat(5-hp);$('score').textContent='スコア '+score;$('combo').textContent='コンボ '+combo;$('acc').textContent='正確率(せいかくりつ) '+Math.round(100*correct/Math.max(1,correct+miss))+'%';$('hpbar').style.width=(hp*20)+'%';$('timerbar').style.width=(Math.max(0,remaining)/duration*100)+'%';$('time').textContent=Math.max(0,remaining).toFixed(1);$('level').textContent=level}
function next(){let i=Math.floor(Math.random()*QUESTIONS.length);if(QUESTIONS.length>1&&i===previous)i=(i+1)%QUESTIONS.length;previous=i;current=QUESTIONS[i];answers=current[1].split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);duration=Math.max(3.5,10-(level-1)*.55);remaining=duration;$('word').textContent=current[0];$('roman').textContent=answers.join(' / ');$('answer').value='';$('answer').focus();update()}
function end(){running=false;clearInterval(interval);$('answer').disabled=true;$('start').disabled=false;$('reset').disabled=true;$('start').textContent='▶ もう一度プレイ';$('word').textContent='ゲームオーバー';$('roman').textContent='最終(さいしゅう)スコア '+score;$('message').textContent='正解入力文字(せいかいにゅうりょくもじ) '+correct+' / ミス '+miss+' 回(かい)';update()}
function damage(message){hp--;combo=0;$('message').textContent=message+' HP −1';if(hp<=0){hp=0;end()}}
function start(){if(!QUESTIONS.length)return;clearInterval(interval);hp=5;score=0;combo=0;correct=0;miss=0;level=1;previous=-1;running=true;$('answer').disabled=false;$('start').disabled=true;$('reset').disabled=false;$('message').textContent='入力(にゅうりょく)してください';next();last=performance.now();interval=setInterval(()=>{if(!running)return;let now=performance.now();remaining-=Math.min(.5,(now-last)/1000);last=now;if(remaining<=0){miss++;damage('時間切(じかんぎ)れ！');if(running)next()}update()},50)}
$('answer').addEventListener('input',()=>{if(!running)return;const s=$('answer').value.toLowerCase().replace(/\s+/g,'');if(!s)return;if(answers.includes(s)){correct+=s.length;combo++;let points=100+combo*20+Math.round(remaining*10);score+=points;level=1+Math.floor((correct+miss)/30);$('message').textContent='正解(せいかい)！ +'+points+' 点(てん)';next()}else if(!answers.some(a=>a.startsWith(s))){miss++;damage('入力(にゅうりょく)ミス！');$('answer').value='';update()}});
$('start').onclick=start;$('reset').onclick=()=>{clearInterval(interval);running=false;hp=5;score=0;combo=0;correct=0;miss=0;level=1;remaining=duration=10;$('answer').value='';$('answer').disabled=true;$('start').disabled=false;$('reset').disabled=true;$('word').textContent='準備完了(じゅんびかんりょう)？';$('roman').textContent='READY';$('message').textContent='スタートを押(お)してください';update()};update();
</script></body></html>
